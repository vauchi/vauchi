# typos source code spell checker configuration
# https://github.com/crate-ci/typos

[files]
extend-exclude = [
    "target/",
    "node_modules/",
    "dist/",
    "build/",
    "*.lock",
    "*.woff",
    "*.woff2",
    "generated/",
]

[default.extend-identifiers]
# Apple UDID (Unique Device Identifier) — not a typo for UUID
UDID = "UDID"

[default.extend-words]
# Domain-specific terms that are not typos
udid = "udid"
# PNGs is a valid plural of PNG (image format)
PNGs = "PNGs"
# Federation test: _ba = connection from relay B to relay A
ba = "ba"
# Ratatui is a Rust TUI framework name
Ratatui = "Ratatui"
ratatui = "ratatui"
# Intentional substring match for upstream error messages with typos
ecryption = "ecryption"
