# GitLab License Compliance Decisions
# https://docs.gitlab.com/ee/user/compliance/license_approval_policies.html
#
# This file defines which licenses are approved, denied, or need review.
# Synced with core/deny.toml for consistency.

---
# Approved licenses - these can be used without restriction
approved:
  - MIT
  - Apache-2.0
  - Apache-2.0 WITH LLVM-exception
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - Zlib
  - Unicode-3.0
  - Unicode-DFS-2016
  - CC0-1.0
  - MPL-2.0
  - OpenSSL  # For ring crate

# Licenses that require review before use
needs_review:
  - LGPL-2.1
  - LGPL-3.0
  - EPL-1.0
  - EPL-2.0

# Denied licenses - these cannot be used
denied:
  - GPL-2.0
  - GPL-3.0
  - AGPL-3.0
  - SSPL-1.0
  - BSL-1.0  # Business Source License
  - Proprietary
  - Unknown

# Package-specific decisions (override license detection)
packages:
  ring:
    license: "MIT AND ISC AND OpenSSL"
    decision: approved
    reason: "Cryptographic library with permissive licenses"
