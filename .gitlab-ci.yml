# GitLab CI/CD Pipeline for Vauchi
#
# Pipeline strategy:
#   - MR: Full validation (lint:reuse, secret detection)
#   - Scheduled: Security scans + prerelease cleanup
#   Main branch is protected and merge-only. All validation happens
#   during the MR pipeline; post-merge pipelines are unnecessary.
#
# GitLab Ultimate Features (via Open Source Program):
#   - Secret Detection: Prevent accidental credential commits
#
# Runner Configuration:
#   Self-hosted group runners (allyson + nell):
#   - docker jobs → allyson-docker (tags: docker, self-hosted)
#   - shell jobs  → allyson-shell / nell-shell (tags: linux/macos, self-hosted)
#   See _private/infra/runners/ for runner details.

# GitLab Ultimate Templates
include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - project: 'vauchi/scripts'
    ref: ci-templates-v2026.07.2
    file: '/ci-templates/reuse.yml'

variables:
  VAUCHI_SCRIPTS_REF: "ci-templates-v2026.07.2"

stages:
  - lint
  - security
  - deploy

# REUSE compliance provided by vauchi/scripts ci-templates/reuse.yml

test:release-gates:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  before_script:
    - apk add --no-cache bash just python3
  script:
    - JUST_UNSTABLE=1 just test-release-gates
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - .gitlab-ci.yml
          - just/plan.just
          - tests/test_release_gates.py

# lint:claude-md retired 2026-06-12: the .claude tree moved to the
# _private repo (root .claude is a symlink), so this repo's CI checkout
# can no longer see it — CLAUDE.md ↔ .claude/docs consistency is checked
# where both sides exist: `just session-end` / `just check-claude-md`.

# Secret detection (MR + scheduled)
secret_detection:
  allow_failure: false
  stage: security
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Weekly prerelease cleanup (scheduled only)
# Fetches cleanup script from vauchi/scripts at runtime.
cleanup:prerelease:
  stage: deploy
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.12-slim
  tags: [docker]
  needs: []
  variables:
    RETENTION_DAYS: "14"
  before_script:
    - apt-get update -qq && apt-get install -yqq curl >/dev/null
  script:
    - export GITLAB_TOKEN="${CLEANUP_TOKEN:-${CI_JOB_TOKEN}}"
    - >-
      curl -sf
      -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}"
      "https://gitlab.com/api/v4/projects/vauchi%2Fscripts/repository/files/scripts%2Fcleanup-prerelease.sh/raw?ref=${VAUCHI_SCRIPTS_REF}"
      -o /tmp/cleanup.sh
    - chmod +x /tmp/cleanup.sh
    - /tmp/cleanup.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CLEANUP_PRERELEASE == "true"
