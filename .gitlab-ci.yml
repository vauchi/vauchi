# DX regression gates — VIC01 (.idea config hygiene) + VSP01 (stale
# ci-template pin). Checkers are fetched from vauchi/scripts at
# $VAUCHI_SCRIPTS_REF, so that pin MUST point at a tag that contains them
# (first shipped in the July 2026 template tags). Name no tag in a comment
# here: the check-stale-ci-pin.sh at the pinned ref reads every tag-shaped
# string in this file as a pin, so a named tag fails VSP01 once eight newer
# tags exist (seen 2026-09-30 when ci-templates-v2026.09.30 was cut).
# VHC01 harness-parity is deliberately NOT run here: .codex/.kimi-code/.junie
# are symlinks into the _private repo, which this public checkout never clones,
# so `find -L -type l` would see broken links and false-fail. VHC01 stays a
# `just session-end` gate (where _private is present).
lint:dx-gates:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  variables:
    SCRIPTS_API: "https://gitlab.com/api/v4/projects/vauchi%2Fscripts"
  before_script:
    - apk add --no-cache bash git curl
  script:
    - export GITLAB_TOKEN="${SCRIPTS_READ_TOKEN:-${CI_JOB_TOKEN}}"
    - |
      fetch_checker() {
        curl -sf -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          "${SCRIPTS_API}/repository/files/scripts%2F$1/raw?ref=${VAUCHI_SCRIPTS_REF}" \
          -o "/tmp/$1"
        chmod +x "/tmp/$1"
      }
    # VIC01: tracked .idea/ stays portable (no per-user state, no absolute paths).
    - fetch_checker check-idea-config.sh
    - /tmp/check-idea-config.sh .
    # VSP01: this repo's own ci-template pin must be among the latest tags.
    # NB: lexical reverse-sort is correct while N is single-digit; move to a
    # version-aware sort before ci-templates-v*.10 ships.
    - fetch_checker check-stale-ci-pin.sh
    - >-
      curl -sf -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}"
      "${SCRIPTS_API}/repository/tags?per_page=100"
      | grep -oE 'ci-templates-v[0-9]+\.[0-9]+\.[0-9]+'
      | sort -ru | head -8 > /tmp/recent-ci-tags.txt
    - /tmp/check-stale-ci-pin.sh .gitlab-ci.yml /tmp/recent-ci-tags.txt .gitlab-ci.yml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - .gitlab-ci.yml
          - .idea/**/*

# lint:claude-md retired 2026-06-12: the .claude tree moved to the
# _private repo (root .claude is a symlink), so this repo's CI checkout
# can no longer see it — CLAUDE.md ↔ .claude/docs consistency is checked
# where both sides exist: `just session-end` / `just check-claude-md`.

# Secret detection (MR + scheduled)
secret_detection:
  allow_failure: false
  stage: security
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Workspace architecture ratchets (scheduled only)
# The cross-repo ratchets (`just lint` workspace block / `just gates`)
# need sibling repos checked out — impossible in per-repo CI. This job
# shallow-clones the workspace and runs the full ratchet suite.
# allow_failure: advisory initially (2026-07-18); flip to blocking once
# the first nightly runs are stable.
gates:workspace-ratchets:
  stage: lint
  tags: [linux, self-hosted]
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends bash ripgrep git ca-certificates curl
    - |
      for repo in scripts core ios android macos linux-gtk linux-qt windows tui cli web-demo; do
        git clone --depth=1 --branch main \
          "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/vauchi/${repo}.git" \
          "${CI_PROJECT_DIR}/${repo}"
      done
  script:
    - echo "=== Workspace ratchets (baseline may DROP, never RISE) ==="
    - scripts/scripts/audit-frontend-vocab.sh --check scripts/scripts/audit-frontend-vocab.baseline.json
    - scripts/scripts/audit-dispatch-purity.sh --check scripts/scripts/audit-dispatch-purity.baseline.json
    - scripts/scripts/audit-app-preferences.sh --check scripts/scripts/audit-app-preferences.baseline.json
    - scripts/scripts/audit-frontend-domain-calls.sh --check scripts/scripts/audit-frontend-domain-calls.baseline.json
    - scripts/scripts/audit-ui-literals.sh --check scripts/scripts/audit-ui-literals.baseline.json
    - scripts/scripts/audit-frontend-i18n-strings.sh --check scripts/scripts/audit-frontend-i18n-strings.baseline.json
    - scripts/scripts/audit-shell-surface.sh --check scripts/scripts/audit-shell-surface.baseline.json
    - scripts/scripts/loc-budget.sh --check scripts/scripts/loc-budget.baseline.json

# Core-consumer drift (scheduled only)
#
# Every consumer's native Core pin, read from its main through core's
# ci/consumer-pins.json and vauchi/scripts' core-pins.py (ADR-026
# amendment 2026-09-30, #434). Red when a pin lags the newest core
# release, cannot be read, or a consumer's CI hard-codes a Core ref.
# Release, not newest tag: core cuts -dev tags several times a week, and
# an alarm that is red by default goes unread (gates:workspace-ratchets
# above). Core's release pipeline opens the bump MRs (bump:consumer-pins
# and the trigger jobs), so a red run names MRs waiting to merge.
#
# Replaces the Rust-only dry run of bump-core-consumers.sh, which saw
# neither the Swift, Maven and C ABI pins nor the CI jobs that checked
# against Core v0.59.0.
#
# NOT allow_failure. gates:workspace-ratchets is the cautionary case in
# this same file: added advisory, failed all 29 of its runs, and the
# muting is what kept that invisible
# (backlog/2026-08-21-workspace-ratchets-never-passed). A drift report
# nobody sees is worth less than no report.
#
# CC-27 evidence: core-pins check was observed red on 2026-09-30 (six
# consumers on v0.68.0, relay floating, five CI jobs on CORE_REF v0.59.0)
# and green on the same fixtures once pins were current (core-pins.test.py).
gates:core-consumer-drift:
  stage: lint
  tags: [linux, self-hosted]
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates python3
    - |
      git clone --depth 1 --branch main https://gitlab.com/vauchi/scripts.git "${CI_PROJECT_DIR}/scripts"
      git clone --branch main https://gitlab.com/vauchi/core.git "${CI_PROJECT_DIR}/core"
      # The newest release is read from core's tags.
      git -C "${CI_PROJECT_DIR}/core" fetch --tags --force
      for repo in $(python3 "${CI_PROJECT_DIR}/scripts/scripts/core-pins.py" consumers \
          --table "${CI_PROJECT_DIR}/core/ci/consumer-pins.json" | cut -d' ' -f1); do
        git clone --depth 1 --filter=blob:none --branch main \
          "https://gitlab.com/vauchi/${repo}.git" "${CI_PROJECT_DIR}/${repo}"
      done
  script:
    - |
      rc=0
      python3 "${CI_PROJECT_DIR}/scripts/scripts/core-pins.py" check \
        --root "${CI_PROJECT_DIR}" --strict > drift.txt 2>&1 || rc=$?
      cat drift.txt
      if [ "$rc" -ne 0 ]; then
        echo ""
        echo "A consumer's Core pin needs attention. A lagging pin usually has an"
        echo "open 'chore: pin Core to vX.Y.Z' MR from core's release pipeline."
      fi
      exit "$rc"
  artifacts:
    when: always
    paths:
      - drift.txt
    expire_in: 1 week

# allow_failure budget (scheduled only) — vauchi/private#72
#
# check-allow-failure-budget.sh ran only inside `just housekeeping` from
# 2026-03 to 2026-09, and the count doubled with nobody seeing it. Blocking
# for the same reason as gates:core-consumer-drift: an advisory gate here
# would repeat gates:workspace-ratchets. The budget is the public share
# (74, measured 2026-09-27); _private cannot be cloned here, and its share
# is held by the script's default budget in `just housekeeping`. Lower it
# as entries are removed; never raise it to make the job pass.
# 2026-10-07: raised 59 -> 67 by owner decision, not to pass the job (#543).
# Most of the rise is deliberate: #476's advisory
# check:pictogram-copies-current in seven shells reports assets drift
# without turning an MR red. Core's consumer pin-bump job and iOS
# screenshots:store (#489) also arrived since 2026-09-28.
gates:allow-failure-budget:
  stage: lint
  tags: [linux, self-hosted]
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates
    - |
      for repo in scripts core cli tui e2e relay ohttp-relay linux-gtk linux-qt windows web-demo ios macos android docs features website locales themes; do
        git clone --depth=1 --branch main \
          "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/vauchi/${repo}.git" \
          "${CI_PROJECT_DIR}/${repo}"
      done
  script:
    - bash scripts/scripts/check-allow-failure-budget.sh --budget 67 .

# Weekly prerelease cleanup (scheduled only)
# Fetches cleanup script from vauchi/scripts at runtime.
cleanup:prerelease:
  stage: deploy
  interruptible: false
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.12-slim
  tags: [docker]
  needs: []
  variables:
    RETENTION_DAYS: "14"
  before_script:
    - apt-get update -qq && apt-get install -yqq curl >/dev/null
  script:
    - export GITLAB_TOKEN="${CLEANUP_TOKEN:-${CI_JOB_TOKEN}}"
    - >-
      curl -sf
      -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}"
      "https://gitlab.com/api/v4/projects/vauchi%2Fscripts/repository/files/scripts%2Fcleanup-prerelease.sh/raw?ref=${VAUCHI_SCRIPTS_REF}"
      -o /tmp/cleanup.sh
    - chmod +x /tmp/cleanup.sh
    - /tmp/cleanup.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CLEANUP_PRERELEASE == "true"
