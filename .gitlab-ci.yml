# GitLab CI/CD Pipeline for Vauchi
#
# Meta-repo CI - handles changesets and releases.
# Code-level CI (lint, test, build) runs in individual sub-repos.
#
# To enable code jobs in the meta-repo, you need to configure cross-project
# CI job token access. In each sub-project (core, cli, relay, tui, desktop, e2e):
#   Settings > CI/CD > Job token permissions > Add "vauchi/vauchi"
#
# Then set CI variable: ENABLE_CODE_JOBS=true

stages:
  - lint
  - test
  - release

variables:
  # Set to "true" to enable code jobs (requires cross-project token access)
  ENABLE_CODE_JOBS: "false"

# ============================================================
# Meta-repo Jobs (always work)
# ============================================================

# Node.js cache for changeset jobs
.node-cache: &node-cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}-node
    paths:
      - node_modules/

# Check for changesets on MRs
# Note: Uses simple file check instead of `changeset status` because
# the changeset config references packages in sub-repos that aren't cloned in CI
changeset:check:
  stage: release
  image: alpine:latest
  script:
    - CHANGESET_FILES=$(ls .changeset/*.md 2>/dev/null | grep -v README.md || true)
    - |
      if [ -z "$CHANGESET_FILES" ]; then
        echo "INFO: No changeset found."
        echo "If this MR includes user-facing changes, consider adding a changeset."
        echo "To add a changeset, run: npx changeset add"
      else
        echo "Found changeset(s):"
        echo "$CHANGESET_FILES"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Version packages when changesets are merged to main
changeset:version:
  stage: release
  image: node:20
  <<: *node-cache
  script:
    - npm install
    - |
      # Check if there are changesets to consume
      CHANGESET_COUNT=$(ls -1 .changeset/*.md 2>/dev/null | grep -v README.md | wc -l || echo "0")
      if [ "$CHANGESET_COUNT" -gt "0" ]; then
        echo "Found $CHANGESET_COUNT changeset(s) to consume"

        # Configure git
        git config user.name "GitLab CI"
        git config user.email "ci@gitlab.com"

        # Run version command (updates package.json and syncs to Rust)
        npm run changeset:version

        # Show changes
        git diff --stat

        # Commit and push (requires CI job token with write access)
        git add -A
        git commit -m "chore: version packages [skip ci]" || echo "No changes to commit"

        # Note: Pushing requires appropriate GitLab permissions
        # git push origin HEAD:main
        echo "Version bump complete. Review and merge manually or configure CI push."
      else
        echo "No changesets to consume"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true  # May fail if no write permissions

# Create release tag
changeset:release:
  stage: release
  image: node:20
  <<: *node-cache
  script:
    - npm install
    - |
      # Get version from package.json
      VERSION=$(node -p "require('./desktop/ui/package.json').version || require('./package.json').version")
      TAG="v$VERSION"

      # Check if tag already exists
      if git rev-parse "$TAG" >/dev/null 2>&1; then
        echo "Tag $TAG already exists, skipping"
      else
        echo "Creating release tag $TAG"

        # Configure git
        git config user.name "GitLab CI"
        git config user.email "ci@gitlab.com"

        # Create annotated tag
        git tag -a "$TAG" -m "Release $TAG"

        # Note: Pushing requires appropriate GitLab permissions
        # git push origin "$TAG"
        echo "Tag $TAG created. Push manually or configure CI push."
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual  # Manual trigger for releases
  allow_failure: true

# ============================================================
# Code Jobs (require ENABLE_CODE_JOBS=true and cross-project access)
# ============================================================
#
# These jobs clone sub-repositories and require cross-project CI token access.
# To enable:
# 1. In each sub-project, go to: Settings > CI/CD > Job token permissions
# 2. Add "vauchi/vauchi" to allow access
# 3. Set CI variable ENABLE_CODE_JOBS=true in this project

# Clone sub-repositories (main repo is a meta-repo)
.clone-repos: &clone-repos
  before_script:
    - |
      echo "Cloning sub-repositories..."
      for repo in core relay cli tui desktop e2e; do
        if [ ! -d "$repo" ]; then
          git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/vauchi/$repo.git" "$repo" || echo "Failed to clone $repo"
        fi
      done

# Cache Cargo dependencies
.rust-cache: &rust-cache
  <<: *clone-repos
  cache:
    key: ${CI_COMMIT_REF_SLUG}-rust
    paths:
      - .cargo/bin/
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - core/target/
  variables:
    CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
    RUST_BACKTRACE: "1"

lint:format:
  stage: lint
  image: rust:latest
  <<: *rust-cache
  script:
    - rustup component add rustfmt
    - cd core && cargo fmt --all -- --check
  rules:
    - if: $ENABLE_CODE_JOBS == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $ENABLE_CODE_JOBS == "true" && $CI_COMMIT_BRANCH == "main"

lint:clippy:
  stage: lint
  image: rust:latest
  <<: *rust-cache
  script:
    - rustup component add clippy
    - cd core && cargo clippy --workspace -- -D warnings
  rules:
    - if: $ENABLE_CODE_JOBS == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $ENABLE_CODE_JOBS == "true" && $CI_COMMIT_BRANCH == "main"

test:unit:
  stage: test
  image: rust:latest
  <<: *rust-cache
  script:
    - cd core && cargo test --workspace
  rules:
    - if: $ENABLE_CODE_JOBS == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $ENABLE_CODE_JOBS == "true" && $CI_COMMIT_BRANCH == "main"
