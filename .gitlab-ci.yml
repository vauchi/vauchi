# GitLab CI/CD Pipeline for Vauchi
#
# Mirrors GitHub Actions functionality for GitLab users

stages:
  - lint
  - test
  - security
  - build
  - release
  - deploy

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  RUST_BACKTRACE: "1"

# Cache Cargo dependencies
.rust-cache: &rust-cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}-rust
    paths:
      - .cargo/bin/
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - code/target/

# ============================================================
# Lint Stage
# ============================================================

lint:format:
  stage: lint
  image: rust:latest
  <<: *rust-cache
  script:
    - rustup component add rustfmt
    - cd code && cargo fmt --all -- --check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

lint:clippy:
  stage: lint
  image: rust:latest
  <<: *rust-cache
  script:
    - rustup component add clippy
    - cd code && cargo clippy --workspace -- -D warnings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# ============================================================
# Test Stage
# ============================================================

test:unit:
  stage: test
  image: rust:latest
  <<: *rust-cache
  script:
    - cd code && cargo test --workspace
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

test:all-features:
  stage: test
  image: rust:latest
  <<: *rust-cache
  script:
    - cd code && cargo test --workspace --all-features
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================================
# Security Stage
# ============================================================

security:audit:
  stage: security
  image: rust:latest
  <<: *rust-cache
  script:
    - cargo install cargo-audit
    - cd code && cargo audit
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/Cargo.toml"
        - "**/Cargo.lock"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"

security:deny:
  stage: security
  image: rust:latest
  <<: *rust-cache
  script:
    - cargo install cargo-deny
    - cd code && cargo deny check
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/Cargo.toml"
        - "**/Cargo.lock"
        - "code/deny.toml"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ============================================================
# Build Stage
# ============================================================

build:rust:
  stage: build
  image: rust:latest
  <<: *rust-cache
  script:
    - cd code && cargo build --workspace --release
  artifacts:
    paths:
      - code/target/release/vauchi-*
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

build:docs:
  stage: build
  image: rust:latest
  <<: *rust-cache
  script:
    - cd code && cargo doc --workspace --no-deps
  artifacts:
    paths:
      - code/target/doc/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

build:android:
  stage: build
  image: rust:latest
  <<: *rust-cache
  variables:
    ANDROID_NDK_VERSION: "26.1.10909125"
  before_script:
    - apt-get update && apt-get install -y openjdk-17-jdk wget unzip
    - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
    - cargo install cargo-ndk
    # Install Android SDK and NDK (simplified - may need adjustment for actual GitLab runners)
    - export ANDROID_HOME=/opt/android-sdk
    - mkdir -p $ANDROID_HOME
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
    - unzip -q cmdline-tools.zip -d $ANDROID_HOME
    - mv $ANDROID_HOME/cmdline-tools $ANDROID_HOME/cmdline-tools-latest
    - mkdir -p $ANDROID_HOME/cmdline-tools
    - mv $ANDROID_HOME/cmdline-tools-latest $ANDROID_HOME/cmdline-tools/latest
    - yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
    - $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;${ANDROID_NDK_VERSION}"
    - export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}
  script:
    - ./code/scripts/build-android.sh release
    - cd android && ./gradlew assembleRelease
  artifacts:
    paths:
      - android/app/build/outputs/apk/release/*.apk
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true  # May fail if Android SDK setup has issues

# ============================================================
# Scheduled Jobs
# ============================================================

# Weekly security scan
security:weekly:
  stage: security
  image: rust:latest
  <<: *rust-cache
  script:
    - cargo install cargo-audit cargo-deny
    - cd code && cargo audit
    - cd code && cargo deny check
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ============================================================
# Release Stage (Changesets)
# ============================================================

# Node.js cache for changeset jobs
.node-cache: &node-cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}-node
    paths:
      - node_modules/

# Check for changesets on MRs
changeset:check:
  stage: release
  image: node:20
  <<: *node-cache
  script:
    - npm ci
    - |
      CHANGESET_COUNT=$(ls -1 .changeset/*.md 2>/dev/null | grep -v README.md | wc -l || echo "0")
      if [ "$CHANGESET_COUNT" -eq "0" ]; then
        echo "WARNING: No changeset found."
        echo "If this MR includes user-facing changes, please add a changeset."
        echo ""
        echo "To add a changeset, run: npx changeset add"
      else
        echo "Found $CHANGESET_COUNT changeset(s)"
        npx changeset status
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Version packages when changesets are merged to main
changeset:version:
  stage: release
  image: node:20
  <<: *node-cache
  script:
    - npm ci
    - |
      # Check if there are changesets to consume
      CHANGESET_COUNT=$(ls -1 .changeset/*.md 2>/dev/null | grep -v README.md | wc -l || echo "0")
      if [ "$CHANGESET_COUNT" -gt "0" ]; then
        echo "Found $CHANGESET_COUNT changeset(s) to consume"

        # Configure git
        git config user.name "GitLab CI"
        git config user.email "ci@gitlab.com"

        # Run version command (updates package.json and syncs to Rust)
        npm run changeset:version

        # Show changes
        git diff --stat

        # Commit and push (requires CI job token with write access)
        git add -A
        git commit -m "chore: version packages [skip ci]" || echo "No changes to commit"

        # Note: Pushing requires appropriate GitLab permissions
        # git push origin HEAD:main
        echo "Version bump complete. Review and merge manually or configure CI push."
      else
        echo "No changesets to consume"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true  # May fail if no write permissions

# Create release tag
changeset:release:
  stage: release
  image: node:20
  <<: *node-cache
  script:
    - npm ci
    - |
      # Get version from package.json
      VERSION=$(node -p "require('./code/vauchi-desktop/ui/package.json').version || require('./package.json').version")
      TAG="v$VERSION"

      # Check if tag already exists
      if git rev-parse "$TAG" >/dev/null 2>&1; then
        echo "Tag $TAG already exists, skipping"
      else
        echo "Creating release tag $TAG"

        # Configure git
        git config user.name "GitLab CI"
        git config user.email "ci@gitlab.com"

        # Create annotated tag
        git tag -a "$TAG" -m "Release $TAG"

        # Note: Pushing requires appropriate GitLab permissions
        # git push origin "$TAG"
        echo "Tag $TAG created. Push manually or configure CI push."
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual  # Manual trigger for releases
  allow_failure: true

# ============================================================
# Pages (Documentation)
# ============================================================

pages:
  stage: deploy
  image: rust:latest
  <<: *rust-cache
  script:
    - cd code && cargo doc --workspace --no-deps
    - mv code/target/doc public
    - echo '<meta http-equiv="refresh" content="0; url=vauchi_core/index.html">' > public/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
