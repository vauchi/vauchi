# GitLab CI/CD Pipeline for Vauchi
#
# Mirrors GitHub Actions functionality for GitLab users

stages:
  - lint
  - test
  - e2e-smoke
  - security
  - build
  - e2e-release
  - release
  - deploy

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  RUST_BACKTRACE: "1"

# Clone sub-repositories (main repo is a meta-repo)
.clone-repos: &clone-repos
  before_script:
    - |
      echo "Cloning sub-repositories..."
      for repo in core relay cli tui desktop e2e; do
        if [ ! -d "$repo" ]; then
          git clone --depth 1 "https://gitlab.com/vauchi/$repo.git" "$repo" || echo "Failed to clone $repo"
        fi
      done

# Cache Cargo dependencies
.rust-cache: &rust-cache
  <<: *clone-repos
  cache:
    key: ${CI_COMMIT_REF_SLUG}-rust
    paths:
      - .cargo/bin/
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - core/target/

# ============================================================
# Lint Stage
# ============================================================

lint:format:
  stage: lint
  image: rust:latest
  <<: *rust-cache
  script:
    - rustup component add rustfmt
    - cd core && cargo fmt --all -- --check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

lint:clippy:
  stage: lint
  image: rust:latest
  <<: *rust-cache
  script:
    - rustup component add clippy
    - cd core && cargo clippy --workspace -- -D warnings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

lint:bindings:
  stage: lint
  image: rust:latest
  <<: *rust-cache
  script:
    - cd core && RUSTFLAGS="-Cstrip=none" cargo build -p vauchi-mobile --release
    - cd core && ./scripts/validate-bindings.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "core/vauchi-mobile/**/*"
        - "core/vauchi-core/**/*"
        - "android/app/src/main/kotlin/uniffi/**/*"
        - "ios/Vauchi/Generated/**/*"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# ============================================================
# Test Stage
# ============================================================

test:unit:
  stage: test
  image: rust:latest
  <<: *rust-cache
  script:
    - cd core && cargo test --workspace
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

test:all-features:
  stage: test
  image: rust:latest
  <<: *rust-cache
  script:
    - cd core && cargo test --workspace --all-features
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================================
# E2E Smoke Stage (Fast feedback on every MR)
# ============================================================

e2e:smoke:
  stage: e2e-smoke
  image: rust:latest
  <<: *rust-cache
  before_script:
    - cargo install cargo-nextest --locked || true
  script:
    # Build CLI and relay binaries
    - cd cli && cargo build --target-dir ../target
    - cd ../relay && cargo build --target-dir ../target
    # Run smoke tests only (tests prefixed with smoke_)
    - cd ../e2e && cargo nextest run --no-fail-fast smoke_ -- --ignored 2>&1 || true
    - cd ../e2e && cargo nextest run smoke_ -- --ignored --message-format json > ../target/e2e-smoke-results.json 2>&1 || true
  artifacts:
    when: always
    paths:
      - target/e2e-smoke-results.json
    reports:
      junit: target/e2e-results.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true  # Don't block MRs initially while stabilizing

# ============================================================
# E2E Release Stage (Full validation before release)
# ============================================================

e2e:release:
  stage: e2e-release
  image: rust:latest
  <<: *rust-cache
  before_script:
    - cargo install cargo-nextest --locked || true
  script:
    # Build CLI and relay binaries in release mode
    - cd cli && cargo build --release --target-dir ../target
    - cd ../relay && cargo build --release --target-dir ../target
    # Run all e2e tests (smoke + integration)
    - cd ../e2e && cargo nextest run --release -- --ignored
  artifacts:
    when: always
    paths:
      - target/e2e-release-results.json
    reports:
      junit: target/e2e-results.xml
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  allow_failure: false  # RELEASE GATE - blocks if E2E fails

# ============================================================
# Security Stage
# ============================================================

security:audit:
  stage: security
  image: rust:latest
  <<: *rust-cache
  script:
    - cargo install cargo-audit
    - cd core && cargo audit
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/Cargo.toml"
        - "**/Cargo.lock"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"

security:deny:
  stage: security
  image: rust:latest
  <<: *rust-cache
  script:
    - cargo install cargo-deny
    - cd core && cargo deny check
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/Cargo.toml"
        - "**/Cargo.lock"
        - "core/deny.toml"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ============================================================
# Build Stage
# ============================================================

build:rust:
  stage: build
  image: rust:latest
  <<: *rust-cache
  script:
    - cd core && cargo build --workspace --release
  artifacts:
    paths:
      - core/target/release/vauchi-*
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

build:docs:
  stage: build
  image: rust:latest
  <<: *rust-cache
  script:
    - cd core && cargo doc --workspace --no-deps
  artifacts:
    paths:
      - core/target/doc/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

build:android:
  stage: build
  image: rust:latest
  <<: *rust-cache
  variables:
    ANDROID_NDK_VERSION: "26.1.10909125"
  before_script:
    - apt-get update && apt-get install -y openjdk-17-jdk wget unzip
    - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
    - cargo install cargo-ndk
    # Install Android SDK and NDK (simplified - may need adjustment for actual GitLab runners)
    - export ANDROID_HOME=/opt/android-sdk
    - mkdir -p $ANDROID_HOME
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
    - unzip -q cmdline-tools.zip -d $ANDROID_HOME
    - mv $ANDROID_HOME/cmdline-tools $ANDROID_HOME/cmdline-tools-latest
    - mkdir -p $ANDROID_HOME/cmdline-tools
    - mv $ANDROID_HOME/cmdline-tools-latest $ANDROID_HOME/cmdline-tools/latest
    - yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
    - $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;${ANDROID_NDK_VERSION}"
    - export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}
  script:
    - ./core/scripts/build-android.sh release
    - cd android && ./gradlew assembleRelease
  artifacts:
    paths:
      - android/app/build/outputs/apk/release/*.apk
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true  # May fail if Android SDK setup has issues

# ============================================================
# Scheduled Jobs
# ============================================================

# Weekly security scan
security:weekly:
  stage: security
  image: rust:latest
  <<: *rust-cache
  script:
    - cargo install cargo-audit cargo-deny
    - cd core && cargo audit
    - cd core && cargo deny check
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ============================================================
# Release Stage (Changesets)
# ============================================================

# Node.js cache for changeset jobs
.node-cache: &node-cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}-node
    paths:
      - node_modules/

# Check for changesets on MRs
changeset:check:
  stage: release
  image: node:20
  <<: *node-cache
  script:
    - npm ci
    - |
      CHANGESET_COUNT=$(ls -1 .changeset/*.md 2>/dev/null | grep -v README.md | wc -l || echo "0")
      if [ "$CHANGESET_COUNT" -eq "0" ]; then
        echo "WARNING: No changeset found."
        echo "If this MR includes user-facing changes, please add a changeset."
        echo ""
        echo "To add a changeset, run: npx changeset add"
      else
        echo "Found $CHANGESET_COUNT changeset(s)"
        npx changeset status
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Version packages when changesets are merged to main
changeset:version:
  stage: release
  image: node:20
  <<: *node-cache
  script:
    - npm ci
    - |
      # Check if there are changesets to consume
      CHANGESET_COUNT=$(ls -1 .changeset/*.md 2>/dev/null | grep -v README.md | wc -l || echo "0")
      if [ "$CHANGESET_COUNT" -gt "0" ]; then
        echo "Found $CHANGESET_COUNT changeset(s) to consume"

        # Configure git
        git config user.name "GitLab CI"
        git config user.email "ci@gitlab.com"

        # Run version command (updates package.json and syncs to Rust)
        npm run changeset:version

        # Show changes
        git diff --stat

        # Commit and push (requires CI job token with write access)
        git add -A
        git commit -m "chore: version packages [skip ci]" || echo "No changes to commit"

        # Note: Pushing requires appropriate GitLab permissions
        # git push origin HEAD:main
        echo "Version bump complete. Review and merge manually or configure CI push."
      else
        echo "No changesets to consume"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true  # May fail if no write permissions

# Create release tag
changeset:release:
  stage: release
  image: node:20
  <<: *node-cache
  script:
    - npm ci
    - |
      # Get version from package.json
      VERSION=$(node -p "require('./desktop/ui/package.json').version || require('./package.json').version")
      TAG="v$VERSION"

      # Check if tag already exists
      if git rev-parse "$TAG" >/dev/null 2>&1; then
        echo "Tag $TAG already exists, skipping"
      else
        echo "Creating release tag $TAG"

        # Configure git
        git config user.name "GitLab CI"
        git config user.email "ci@gitlab.com"

        # Create annotated tag
        git tag -a "$TAG" -m "Release $TAG"

        # Note: Pushing requires appropriate GitLab permissions
        # git push origin "$TAG"
        echo "Tag $TAG created. Push manually or configure CI push."
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual  # Manual trigger for releases
  allow_failure: true

# ============================================================
# Pages (Documentation)
# ============================================================

pages:
  stage: deploy
  image: rust:latest
  <<: *rust-cache
  script:
    - cd core && cargo doc --workspace --no-deps
    - mv core/target/doc public
    - echo '<meta http-equiv="refresh" content="0; url=vauchi_core/index.html">' > public/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
