# GitLab CI/CD Pipeline for Vauchi
#
# Pipeline strategy:
#   - MR: Full validation (lint:reuse, secret detection)
#   - Scheduled: Security scans + prerelease cleanup
#   Main branch is protected and merge-only. All validation happens
#   during the MR pipeline; post-merge pipelines are unnecessary.
#
# GitLab Ultimate Features (via Open Source Program):
#   - Secret Detection: Prevent accidental credential commits
#
# Runner Configuration:
#   Self-hosted group runners (allyson + nell):
#   - docker jobs → allyson-docker (tags: docker, self-hosted)
#   - shell jobs  → allyson-shell / nell-shell (tags: linux/macos, self-hosted)
#   See _private/infra/runners/ for runner details.

# GitLab Ultimate Templates
include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - project: 'vauchi/scripts'
    ref: ci-templates-v2026.10.08
    file: '/ci-templates/reuse.yml'

variables:
  VAUCHI_SCRIPTS_REF: "fa7f720d567eaf0d13436112acff205efdcd69d4"

# Superseded pipelines auto-cancel so stale runs don't hog shared runners
# (the dominant queue-time cause). Jobs are interruptible by default and
# retry only on infrastructure failures — never a real test/lint failure
# (CC-18). Root runs MR/schedule pipelines only, so no push-dedup rule is
# needed. The deploy-stage cleanup job overrides interruptible: false.
workflow:
  # vci05-ok: root has no push pipelines on main (jobs run on MR and
  # schedule only), so a merge never starts a pipeline that could cancel one.
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure

stages:
  - lint
  - security
  - deploy

# REUSE compliance provided by vauchi/scripts ci-templates/reuse.yml

test:release-gates:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  before_script:
    # procps: rig-lib.sh reads a holder's start time with ps -o lstart,
    # which BusyBox ps lacks.
    - apk add --no-cache bash git jq just python3 procps
  script:
    # A SHA pin, like Core's (private#994): --branch cannot fetch one.
    - git -C . init -q scripts && git -C scripts remote add origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/vauchi/scripts.git" && git -C scripts fetch -q --depth 1 origin "$VAUCHI_SCRIPTS_REF" && git -C scripts checkout -q --detach FETCH_HEAD
    - JUST_UNSTABLE=1 just test-check-recipe
    - JUST_UNSTABLE=1 just test-codex-layout
    - JUST_UNSTABLE=1 just test-claude-layout
    - JUST_UNSTABLE=1 just test-tooling-layout
    - JUST_UNSTABLE=1 just test-release-gates
    - JUST_UNSTABLE=1 just test-lint-docs
    - JUST_UNSTABLE=1 just test-check-prerequisites
    - JUST_UNSTABLE=1 just test-lint-recipe
    - JUST_UNSTABLE=1 just test-test-name-recipe
    - JUST_UNSTABLE=1 just test-mr-create-recipe
    - JUST_UNSTABLE=1 just test-lint-ci-needs-recipe
    - JUST_UNSTABLE=1 just test-deploy-check
    - JUST_UNSTABLE=1 just test-deploy-latest
    - JUST_UNSTABLE=1 just test-runners-health
    - JUST_UNSTABLE=1 just slot test
    - JUST_UNSTABLE=1 just rig test
    - python3 tests/test_issue_claims.py .
    - JUST_UNSTABLE=1 just harness test
