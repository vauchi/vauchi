# GitLab CI/CD Pipeline for Vauchi
#
# Pipeline strategy:
#   - MR: Full validation (lint:reuse, secret detection)
#   - Scheduled: Security scans + prerelease cleanup
#   Main branch is protected and merge-only. All validation happens
#   during the MR pipeline; post-merge pipelines are unnecessary.
#
# GitLab Ultimate Features (via Open Source Program):
#   - Secret Detection: Prevent accidental credential commits
#
# Runner Configuration:
#   Self-hosted group runners (allyson + nell):
#   - docker jobs → allyson-docker (tags: docker, self-hosted)
#   - shell jobs  → allyson-shell / nell-shell (tags: linux/macos, self-hosted)
#   See _private/infra/runners/ for runner details.

# GitLab Ultimate Templates
include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - project: 'vauchi/scripts'
    ref: ci-templates-v2026.09.07
    file: '/ci-templates/reuse.yml'

variables:
  VAUCHI_SCRIPTS_REF: "ci-templates-v2026.09.07"

# Superseded pipelines auto-cancel so stale runs don't hog shared runners
# (the dominant queue-time cause). Jobs are interruptible by default and
# retry only on infrastructure failures — never a real test/lint failure
# (CC-18). Root runs MR/schedule pipelines only, so no push-dedup rule is
# needed. The deploy-stage cleanup job overrides interruptible: false.
workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure

stages:
  - lint
  - security
  - deploy

# REUSE compliance provided by vauchi/scripts ci-templates/reuse.yml

test:release-gates:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  before_script:
    - apk add --no-cache bash git jq just python3
  script:
    - JUST_UNSTABLE=1 just test-codex-layout
    - JUST_UNSTABLE=1 just test-claude-layout
    - JUST_UNSTABLE=1 just test-release-gates
    - JUST_UNSTABLE=1 just test-core-freshness
    - JUST_UNSTABLE=1 just test-lint-docs
    - JUST_UNSTABLE=1 just test-check-prerequisites
    - JUST_UNSTABLE=1 just test-lint-recipe
    - JUST_UNSTABLE=1 just test-deploy-check
    - JUST_UNSTABLE=1 just test-deploy-latest
    - JUST_UNSTABLE=1 just worktree test
    - python3 -m unittest tests/test_backup_recipe_authority.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - .agents
          - .agents/**/*
          - .gitlab-ci.yml
          # The lint recipe lives here; without it a change to the arms
          # guarded by test_lint_recipe_reports_failure.py never runs the job.
          - justfile
          - just/plan.just
          - just/dev.just
          - just/setup.just
          - just/gitlab.just
          - just/check-prerequisites.sh
          - just/lint-docs.sh
          - just/worktree.just
          - just/claude-layout-lib.sh
          - just/deploy.just
          - just/deploy-running.sh
          - tests/test_backup_recipe_authority.py
          - tests/test_check_prerequisites.py
          - tests/test_core_freshness_recipe.py
          - tests/test_deploy_check_recipe.py
          - tests/test_deploy_latest_recipe.py
          - tests/test_claude_layout.py
          - tests/test_codex_layout.py
          - tests/test_lint_docs_recipe.py
          - tests/test_lint_recipe_reports_failure.py
          - tests/test_release_gates.py
          - tests/test_worktree_recipe.py

# DX regression gates — VIC01 (.idea config hygiene) + VSP01 (stale
# ci-template pin). Checkers are fetched from vauchi/scripts at
# $VAUCHI_SCRIPTS_REF, so that pin MUST point at a tag that contains them
# (added to ci-templates main in ci-templates-v2026.07.9+).
# VHC01 harness-parity is deliberately NOT run here: .codex/.kimi-code/.junie
# are symlinks into the _private repo, which this public checkout never clones,
# so `find -L -type l` would see broken links and false-fail. VHC01 stays a
# `just session-end` gate (where _private is present).
lint:dx-gates:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  variables:
    SCRIPTS_API: "https://gitlab.com/api/v4/projects/vauchi%2Fscripts"
  before_script:
    - apk add --no-cache bash git curl
  script:
    - export GITLAB_TOKEN="${SCRIPTS_READ_TOKEN:-${CI_JOB_TOKEN}}"
    - |
      fetch_checker() {
        curl -sf -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          "${SCRIPTS_API}/repository/files/scripts%2F$1/raw?ref=${VAUCHI_SCRIPTS_REF}" \
          -o "/tmp/$1"
        chmod +x "/tmp/$1"
      }
    # VIC01: tracked .idea/ stays portable (no per-user state, no absolute paths).
    - fetch_checker check-idea-config.sh
    - /tmp/check-idea-config.sh .
    # VSP01: this repo's own ci-template pin must be among the latest tags.
    # NB: lexical reverse-sort is correct while N is single-digit; move to a
    # version-aware sort before ci-templates-v*.10 ships.
    - fetch_checker check-stale-ci-pin.sh
    - >-
      curl -sf -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}"
      "${SCRIPTS_API}/repository/tags?per_page=100"
      | grep -oE 'ci-templates-v[0-9]+\.[0-9]+\.[0-9]+'
      | sort -ru | head -8 > /tmp/recent-ci-tags.txt
    - /tmp/check-stale-ci-pin.sh .gitlab-ci.yml /tmp/recent-ci-tags.txt .gitlab-ci.yml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - .gitlab-ci.yml
          - .idea/**/*

# lint:claude-md retired 2026-06-12: the .claude tree moved to the
# _private repo (root .claude is a symlink), so this repo's CI checkout
# can no longer see it — CLAUDE.md ↔ .claude/docs consistency is checked
# where both sides exist: `just session-end` / `just check-claude-md`.

# Secret detection (MR + scheduled)
secret_detection:
  allow_failure: false
  stage: security
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Workspace architecture ratchets (scheduled only)
# The cross-repo ratchets (`just lint` workspace block / `just gates`)
# need sibling repos checked out — impossible in per-repo CI. This job
# shallow-clones the workspace and runs the full ratchet suite.
# allow_failure: advisory initially (2026-07-18); flip to blocking once
# the first nightly runs are stable.
gates:workspace-ratchets:
  stage: lint
  tags: [linux, self-hosted]
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends bash ripgrep git ca-certificates curl
    - |
      for repo in scripts core ios android macos linux-gtk linux-qt windows tui cli web-demo; do
        git clone --depth=1 --branch main \
          "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/vauchi/${repo}.git" \
          "${CI_PROJECT_DIR}/${repo}"
      done
  script:
    - echo "=== Workspace ratchets (baseline may DROP, never RISE) ==="
    - scripts/scripts/audit-frontend-vocab.sh --check scripts/scripts/audit-frontend-vocab.baseline.json
    - scripts/scripts/audit-dispatch-purity.sh --check scripts/scripts/audit-dispatch-purity.baseline.json
    - scripts/scripts/audit-app-preferences.sh --check scripts/scripts/audit-app-preferences.baseline.json
    - scripts/scripts/audit-frontend-domain-calls.sh --check scripts/scripts/audit-frontend-domain-calls.baseline.json
    - scripts/scripts/audit-ui-literals.sh --check scripts/scripts/audit-ui-literals.baseline.json
    - scripts/scripts/audit-frontend-i18n-strings.sh --check scripts/scripts/audit-frontend-i18n-strings.baseline.json
    - scripts/scripts/audit-shell-surface.sh --check scripts/scripts/audit-shell-surface.baseline.json
    - scripts/scripts/loc-budget.sh --check scripts/scripts/loc-budget.baseline.json

# Core-consumer drift (scheduled only)
#
# bump-core-consumers.sh has existed since 2026-08-09 with no caller —
# not a job, not a schedule, not a recipe. Its own header says a caller
# "decides what to do with a bump that fails to build", and none existed,
# so nothing moved the pins: cli and e2e sat three minor versions behind
# core for a month. verify:downstream-rust did not catch it because those
# two resolve their own tag pin rather than the triggering commit
# (problems/2026-09-07-downstream-verify-tests-the-pin).
#
# NOT allow_failure. gates:workspace-ratchets is the cautionary case in
# this same file: added advisory, failed all 29 of its runs, and the
# muting is what kept that invisible
# (backlog/2026-08-21-workspace-ratchets-never-passed). A drift report
# nobody sees is worth less than no report.
#
# CC-27 evidence: observed failing before it was correct — on 2026-09-07
# the bot reported `e2e FAIL could not resolve` against core's fresh
# v0.64.0-dev.1 tag, because the version pin was derived from the tag
# name; it passed once that was fixed (scripts !554).
gates:core-consumer-drift:
  stage: lint
  tags: [linux, self-hosted]
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl build-essential
    - |
      for repo in scripts core cli e2e tui linux-gtk relay web-demo; do
        git clone --branch main \
          "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/vauchi/${repo}.git" \
          "${CI_PROJECT_DIR}/${repo}"
      done
    # The bot resolves the newest tag by creation date, so core needs its
    # tags, which --depth=1 --branch main would not fetch.
    - git -C "${CI_PROJECT_DIR}/core" fetch --tags --force
  script:
    # --dry-run only: it reads manifests and locks and never invokes cargo,
    # so this alarm cannot fail for toolchain reasons on a runner whose
    # Rust availability is not guaranteed here. Proving a bump still builds
    # needs `--build` and a toolchain; that belongs in a follow-up once the
    # alarm has established what normal looks like.
    - echo "=== Consumer drift against the newest core RELEASE tag ==="
    - sh scripts/scripts/bump-core-consumers.sh --dry-run --stable-only | tee drift.txt
    - |
      # --stable-only, because core cuts -dev tags several times a week
      # (32 in the 30 days to 2026-09-07; dev.1 and dev.2 landed hours
      # apart). "Behind the newest tag" is therefore true on almost any
      # day and would make this red by default — the same way
      # gates:workspace-ratchets above went unread. "Behind the newest
      # release" is the condition that stays false until it matters.
      #
      # Only tag-pinned consumers alarm. Their drift is discrete and
      # actionable: a pin is either the newest tag or it is not, and only
      # an edit moves it. Those lines carry an arrow ("v0.61.0 ->
      # v0.64.0"); a branch = "main" consumer instead reports "refresh
      # lock ... toward main", which is true on almost any day because
      # cargo will not walk a git dep without an explicit update. Alarming
      # on those would make this job permanently red, which is precisely
      # how gates:workspace-ratchets above stopped being read.
      if grep -q ' -> ' drift.txt; then
        echo ""
        echo "Tag-pinned consumers are behind the newest core release:"
        grep ' -> ' drift.txt
        echo ""
        echo "Bump with: sh scripts/scripts/bump-core-consumers.sh --repo <name> --build"
        exit 1
      fi
      echo "Every tag-pinned consumer is on the newest core release."
  artifacts:
    when: always
    paths:
      - drift.txt
    expire_in: 1 week

# Weekly prerelease cleanup (scheduled only)
# Fetches cleanup script from vauchi/scripts at runtime.
cleanup:prerelease:
  stage: deploy
  interruptible: false
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.12-slim
  tags: [docker]
  needs: []
  variables:
    RETENTION_DAYS: "14"
  before_script:
    - apt-get update -qq && apt-get install -yqq curl >/dev/null
  script:
    - export GITLAB_TOKEN="${CLEANUP_TOKEN:-${CI_JOB_TOKEN}}"
    - >-
      curl -sf
      -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}"
      "https://gitlab.com/api/v4/projects/vauchi%2Fscripts/repository/files/scripts%2Fcleanup-prerelease.sh/raw?ref=${VAUCHI_SCRIPTS_REF}"
      -o /tmp/cleanup.sh
    - chmod +x /tmp/cleanup.sh
    - /tmp/cleanup.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CLEANUP_PRERELEASE == "true"
