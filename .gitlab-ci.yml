# GitLab CI/CD Pipeline for Vauchi
#
# Pipeline strategy:
#   - MR: Full validation (lint:reuse, secret detection)
#   - Scheduled: Security scans + prerelease cleanup
#   Main branch is protected and merge-only. All validation happens
#   during the MR pipeline; post-merge pipelines are unnecessary.
#
# GitLab Ultimate Features (via Open Source Program):
#   - Secret Detection: Prevent accidental credential commits
#
# Runner Configuration:
#   Self-hosted group runners (allyson + nell):
#   - docker jobs → allyson-docker (tags: docker, self-hosted)
#   - shell jobs  → allyson-shell / nell-shell (tags: linux/macos, self-hosted)
#   See _private/infra/runners/ for runner details.

# GitLab Ultimate Templates
include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - project: 'vauchi/scripts'
    ref: main
    file: '/ci-templates/reuse.yml'

stages:
  - lint
  - security
  - deploy

# REUSE compliance provided by vauchi/scripts ci-templates/reuse.yml

# Validate CLAUDE.md references and detect orphaned .claude/docs/
lint:claude-md:
  stage: lint
  image: alpine:3.21
  tags: [docker]
  needs: []
  script:
    - |
      set -euo pipefail
      CLAUDE_MD="CLAUDE.md"
      DOCS_DIR=".claude/docs"
      errors=0

      # Check .claude/ paths referenced in CLAUDE.md exist
      for ref in $(grep -oE '`[^`]*\.md`' "$CLAUDE_MD" | tr -d '`' | grep -E '\.claude/'); do
        if [ ! -f "$ref" ]; then
          echo "BROKEN REF: $ref (in CLAUDE.md but file missing)"
          errors=$((errors + 1))
        fi
      done

      # Detect orphaned docs (also searches sibling docs for transitive refs;
      # --exclude prevents a file from appearing to reference itself)
      for f in "$DOCS_DIR"/*.md; do
        name=$(basename "$f")
        if ! grep -qr --exclude="$name" "$name" "$CLAUDE_MD" .claude/rules/ .claude/skills/ "$DOCS_DIR" 2>/dev/null; then
          echo "ORPHANED: $DOCS_DIR/$name"
          errors=$((errors + 1))
        fi
      done

      # Skip _private/ paths — separate repo, not in this checkout

      if [ "$errors" -eq 0 ]; then
        echo "CLAUDE.md: all references valid, no orphaned docs"
      else
        echo "$errors issue(s). Run 'just check-claude-md' locally."
        exit 1
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - CLAUDE.md
        - .claude/docs/**/*
        - .claude/rules/**/*
        - .claude/skills/**/*

# Secret detection (MR + scheduled)
secret_detection:
  stage: security
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Weekly prerelease cleanup (scheduled only)
# Fetches cleanup script from vauchi/scripts at runtime.
cleanup:prerelease:
  stage: deploy
  image: python:3.12-slim
  tags: [docker]
  needs: []
  variables:
    RETENTION_DAYS: "14"
  before_script:
    - apt-get update -qq && apt-get install -yqq curl >/dev/null
  script:
    - export GITLAB_TOKEN="${CLEANUP_TOKEN:-${CI_JOB_TOKEN}}"
    - >-
      curl -sf
      -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}"
      "https://gitlab.com/api/v4/projects/vauchi%2Fscripts/repository/files/scripts%2Fcleanup-prerelease.sh/raw?ref=main"
      -o /tmp/cleanup.sh
    - chmod +x /tmp/cleanup.sh
    - /tmp/cleanup.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CLEANUP_PRERELEASE == "true"
