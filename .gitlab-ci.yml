# GitLab CI/CD Pipeline for Vauchi
#
# Mirrors GitHub Actions functionality for GitLab users
#
# GitLab Ultimate Features (via Open Source Program):
#   - SAST: Static application security testing
#   - Dependency Scanning: Check for vulnerable dependencies
#   - Secret Detection: Prevent accidental credential commits
#   - Container Scanning: Scan Docker images for vulnerabilities
#
# Runner Configuration:
#   Currently using GitLab shared runners for all jobs.
#   Self-hosted runner support is prepared but commented out.
#
# Self-hosted Runner Tags (when registered):
#   - linux, rust, node, android: Linux VM (self-hosted)
#   - macos, ios, xcode: macOS VM (self-hosted)
#   - dind, docker-build: DinD VM (self-hosted)
#
# To enable self-hosted runners:
#   1. Register runners with the appropriate tags (see _private/infra/runners/)
#   2. Uncomment the `tags:` sections in job definitions
#   3. Remove `when: never` from build:ios and build:relay-image

# GitLab Ultimate Templates
# Security scanning, code quality, and license compliance
include:
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - security


# Secret detection on all commits
secret_detection:
  stage: security
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"


