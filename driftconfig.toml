# ─── Layer Detection ─────────────────────────────────────

[layers.markdown]
dev_doc_filenames = [
  "CLAUDE.md",
  "ARCHITECTURE.md",
  "CONTRIBUTING.md",
  "CHANGELOG.md",
  "VISIBILITY_POLICY.md",
]
dev_doc_paths = ["_private/"]
user_doc_paths = ["/docs/"]
user_doc_filenames = ["README.md"]

[layers.gherkin]
problem_paths = ["_private/features/"]
