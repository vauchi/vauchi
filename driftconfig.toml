# ─── Name Tag Patterns ───────────────────────────────────

[[tags.name_patterns.rust]]
pattern = "contact.?card"
tag = "contact-card"

[[tags.name_patterns.rust]]
pattern = "crypt|encrypt|decrypt|cipher"
tag = "crypto"

[[tags.name_patterns.rust]]
pattern = "exchange|swap"
tag = "exchange"

[[tags.name_patterns.rust]]
pattern = "relay|websocket"
tag = "relay"

[[tags.name_patterns.rust]]
pattern = "storage|persist|save|load"
tag = "storage"

[[tags.name_patterns.rust]]
pattern = "identity|ident"
tag = "identity"

[[tags.name_patterns.rust]]
pattern = "recovery|backup|restore"
tag = "recovery"

[[tags.name_patterns.rust]]
pattern = "vouching|vouch|trust"
tag = "vouching"

[[tags.name_patterns.rust]]
pattern = "device|multi.?device"
tag = "device"

[[tags.name_patterns.rust]]
pattern = "sync|merge|conflict"
tag = "sync"

