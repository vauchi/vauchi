#
# The workspace repository registry: one entry per repository, read by the
# justfile (public_repos), scripts/scripts/resolve-repo.sh (which repos each
# just recipe accepts), features' lint:implemented-scenarios (the
# repositories whose tests carry scenario annotations) and
# `repo-registry.py check`, which keeps the root .gitignore and README and
# the group README in step with it. Adding a repository is one entry here.
#
# Fields: path (directory under the workspace root), ecosystem (rust, xcode,
# gradle, cmake, dotnet, npm, mdbook, python, gherkin, shell, html, swift,
# none), public / private / clone_url, ops (just recipes that accept it:
# build, test, fmt, lint, fix, coverage, bench), scenario_root (features'
# lint clones it), profile (a row in the group README), description.


[[repo]]
name = "gitlab-profile"
path = "gitlab-profile"
ecosystem = "none"
public = true
mobile = false
ops = []
scenario_root = false
profile = false
description = "The vauchi group README on GitLab"

